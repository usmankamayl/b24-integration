name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      - name: Синтаксис всех PHP-файлов
        run: |
          find php_interface -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Автотесты
        run: php php_interface/tests/run.php
